; PlatformIO project for the CardinalPointer ESP32 servo interface.
; Controls two standard 5V PWM servos (azimuth + elevation) over BLE.
;
; Build : pio run
; Flash : pio run -t upload
; Monitor: pio device monitor

[platformio]
default_envs = esp32dev

[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=2
lib_deps =
    madhephaestus/ESP32Servo@^1.2.1
    h2zero/NimBLE-Arduino@^1.4.1

; Generic ESP32 DevKit (WROOM-32). Change `board` for other modules.
[env:esp32dev]
board = esp32dev

; Convenience target for the ESP32-S3 DevKit.
[env:esp32-s3-devkitc-1]
board = esp32-s3-devkitc-1
